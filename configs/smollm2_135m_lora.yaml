# LoRA SFT config (CPU-friendly). All values overridable via --key value on the CLI.
model_name: HuggingFaceTB/SmolLM2-135M-Instruct
data_dir: data
output_dir: outputs/smollm2-135m-pm-status-lora
seed: 42
max_length: 768
# LoRA
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
# Optimisation
num_train_epochs: 2
per_device_train_batch_size: 4
gradient_accumulation_steps: 2
learning_rate: 0.0003
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.0
logging_steps: 5
eval_steps: 24
max_steps: -1
